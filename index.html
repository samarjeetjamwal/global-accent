<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎙️ Global Accent Translator</title>
  <style>
    :root {
      --bg: #0f1724;
      --card: #0b1220;
      --glass: rgba(255, 255, 255, 0.03);
      --accent: #38bdf8;
      --text: #e6eef6;
      --muted: #9aa7b2;
      --border: rgba(255, 255, 255, 0.03);
    }

    body {
      font-family: system-ui, sans-serif;
      background: #071026;
      color: var(--text);
      min-height: 100vh;
      padding: 20px;
      display: flex;
      align-items: start;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 1000px;
      background: rgba(255, 255, 255, 0.02);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      border: 1px solid rgba(255,255,255,0.03);
    }

    h1 { font-size: 1.5rem; margin: 0 0 8px; background: linear-gradient(to right, #38bdf8, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .lead { font-size: 0.9rem; color: var(--muted); margin-bottom: 16px; }

    .grid {
      display: grid;
      gap: 16px;
    }

    @media (min-width: 768px) {
      .grid { grid-template-columns: 1fr 300px; }
    }

    .card {
      background: var(--card);
      border-radius: 10px;
      padding: 14px;
      border: 1px solid var(--border);
    }

    button {
      padding: 10px 14px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }

    button.primary {
      background: linear-gradient(180deg, #38bdf8, #0ea5c6);
      color: #012;
      font-weight: 600;
      flex: 1;
    }

    button.ghost {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.04);
      color: var(--muted);
      font-size: 13px;
    }

    button.ghost:hover {
      background: rgba(255,255,255,0.03);
      color: white;
    }

    textarea, select {
      width: 100%;
      padding: 10px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.03);
      border-radius: 8px;
      color: var(--text);
      resize: vertical;
    }

    textarea {
      min-height: 100px;
      font-family: inherit;
    }

    label.small {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .voices {
      max-height: 140px;
      overflow-y: auto;
      border: 1px dashed rgba(255,255,255,0.02);
      background: rgba(255,255,255,0.01);
      border-radius: 8px;
      font-size: 13px;
      padding: 6px;
    }

    .voice-item {
      padding: 6px;
      cursor: pointer;
      border-radius: 6px;
    }

    .voice-item:hover {
      background: rgba(255,255,255,0.02);
    }

    .voice-item.selected {
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.3);
    }

    .log {
      min-height: 120px;
      background: rgba(0,0,0,0.2);
      border-radius: 8px;
      padding: 8px;
      font-size: 13px;
      color: var(--muted);
      overflow-y: auto;
    }

    .pulse {
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.6; }
      100% { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎙️ Global Accent Translator</h1>
    <p class="lead">Click <strong>Allow Microphone</strong> to begin. Works on Chrome/Edge via localhost.</p>

    <div class="grid">
      <!-- LEFT -->
      <div class="card">
        <button id="initBtn" class="primary">🎤 1. Allow Microphone</button>
        <button id="recBtn" class="primary" disabled>2. 🎙️ Start Recording</button>
        <button id="stopBtn" class="ghost" disabled>⏹️ Stop</button>
        <button id="clearBtn" class="ghost">🗑️ Clear</button>

        <div style="margin:12px 0">
          <label class="small">Input Language</label>
          <select id="inputLang">
            <option value="en-US" selected>English (US)</option>
            <option value="en-GB">English (UK)</option>
          </select>
        </div>

        <div style="margin:12px 0">
          <label class="small">Target Accent</label>
          <select id="accentSelect">
            <option value="british-rp">British (RP)</option>
            <option value="australian">Australian</option>
            <option value="american-general" selected>American (General)</option>
          </select>
        </div>

        <label class="small">Transcript</label>
        <textarea id="transcript" placeholder="Speech will appear here..." readonly></textarea>

        <label class="small">Converted Text</label>
        <textarea id="accentText" placeholder="Converted text will appear here..." readonly></textarea>

        <div style="font-size:13px;color:var(--muted);margin:8px 0" id="status">👉 Click Step 1</div>

        <div style="display:flex;gap:10px">
          <button id="playOriginal" class="ghost">▶️ Play Original</button>
          <button id="playAccent" class="ghost">▶️ Play Accent</button>
        </div>
      </div>

      <!-- RIGHT -->
      <div>
        <div class="card">
          <label class="small">🗣️ Select Voice</label>
          <div id="voices" class="voices">Click Step 1 to load voices...</div>
        </div>

        <div class="card">
          <label class="small">Activity Log</label>
          <div id="log" class="log"></div>
        </div>
      </div>
    </div>
  </div>
  <script src="config.js"></script>
<script src="accent.js"></script>


  <script>
    const $ = id => document.getElementById(id);
    const initBtn = $('initBtn');
    const recBtn = $('recBtn');
    const stopBtn = $('stopBtn');
    const clearBtn = $('clearBtn');
    const playOriginal = $('playOriginal');
    const playAccent = $('playAccent');
    const transcript = $('transcript');
    const accentText = $('accentText');
    const status = $('status');
    const inputLang = $('inputLang');
    const accentSelect = $('accentSelect');
    const voices = $('voices');
    const logEl = $('log');

    let recognition = null;
    let speechSynthesis = window.speechSynthesis;
    let voicesList = [];
    let selectedVoiceIndex = null;

    function log(msg, type = '') {
      const entry = document.createElement('div');
      entry.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
      if (type === 'err') entry.style.color = '#fca5a5';
      if (type === 'success') entry.style.color = '#6ee7b7';
      logEl.prepend(entry);
    }

    // ✅ STEP 1: Request Microphone & Unlock Speech
    initBtn.addEventListener('click', async () => {
      status.textContent = '🔒 Requesting microphone...';
      log('Initializing audio systems...');

      try {
        // 🔥 Critical: getUserMedia must be in user gesture
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        log('✅ Microphone access granted', 'success');

        // 🔊 Unlock speechSynthesis by speaking silently
        const utter = new SpeechSynthesisUtterance('');
        utter.volume = 0;
        speechSynthesis.speak(utter);
        setTimeout(loadVoices, 300);

        // ✅ Now initialize SpeechRecognition
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SR) throw new Error('SpeechRecognition not supported');

        recognition = new SR();
        recognition.continuous = true;
        recognition.interimResults = true;
        recognition.lang = inputLang.value;

        recognition.onresult = (e) => {
          let final = '';
          for (let i = e.resultIndex; i < e.results.length; i++) {
            if (e.results[i].isFinal) final += e.results[i][0].transcript + ' ';
          }
          if (final) {
            transcript.value += final;
            status.textContent = `📝 ${transcript.value.trim().length} chars`;
          }
        };

        recognition.onstart = () => {
          recBtn.textContent = '🔴 Recording...';
          recBtn.classList.add('pulse');
          stopBtn.disabled = false;
          log('🎙️ Recording started');
        };

        recognition.onend = () => {
          recBtn.textContent = '🎙️ Start Recording';
          recBtn.classList.remove('pulse');
          stopBtn.disabled = true;
          log('⏹️ Recording stopped');
        };

        recognition.onerror = (e) => {
          log(`❌ Error: ${e.error}`, 'err');
          status.textContent = `Error: ${e.error}`;
        };

        // ✅ Enable controls
        initBtn.disabled = true;
        recBtn.disabled = false;
        status.textContent = '🟢 Ready! Click "Start Recording"';

      } catch (err) {
        log(`❌ Mic access failed: ${err.message}`, 'err');
        status.textContent = '🚫 Failed: ' + (err.name === 'NotAllowedError' ? 'Allow mic in browser' : err.message);
        alert('Microphone access denied. Please allow it and reload.');
      }
    });

    // ✅ STEP 2: Load Voices
    function loadVoices() {
      setTimeout(() => {
        voicesList = speechSynthesis.getVoices();
        voices.innerHTML = '';
        if (voicesList.length === 0) {
          voices.textContent = '🔇 No voices. Try Chrome desktop.';
          return;
        }
        voicesList.forEach((v, i) => {
          const div = document.createElement('div');
          div.className = 'voice-item';
          div.innerHTML = `<strong>${v.name}</strong> <small style="color:#889">${v.lang}</small>`;
          div.dataset.idx = i;
          div.addEventListener('click', () => {
            document.querySelectorAll('.voice-item').forEach(el => el.classList.remove('selected'));
            div.classList.add('selected');
            selectedVoiceIndex = i;
            log(`✅ Voice: ${v.name}`);
          });
          voices.appendChild(div);
        });
        log(`✅ Loaded ${voicesList.length} voices`);
      }, 500);
    }

    if (speechSynthesis.onvoiceschanged !== undefined) {
      speechSynthesis.onvoiceschanged = loadVoices;
    }

    // ✅ Recording Controls
    recBtn.addEventListener('click', () => {
      if (recognition) recognition.start();
    });

    stopBtn.addEventListener('click', () => {
      if (recognition) recognition.stop();
    });

    // ✅ Playback
    function speak(text, label) {
      if (!text) return log(`Nothing to play: ${label}`, 'err');
      const utter = new SpeechSynthesisUtterance(text);
      utter.rate = 1.0;
      utter.pitch = 1.0;

      if (selectedVoiceIndex !== null && voicesList[selectedVoiceIndex]) {
        utter.voice = voicesList[selectedVoiceIndex];
      } else {
        const lang = {
          'british-rp': 'en-GB',
          'australian': 'en-AU',
          'american-general': 'en-US'
        }[accentSelect.value] || 'en-US';
        const matched = voicesList.find(v => v.lang.startsWith(lang));
        utter.voice = matched || voicesList[0] || null;
      }

      speechSynthesis.cancel();
      speechSynthesis.speak(utter);
      log(`▶ Playing: ${label}`);
    }

    playOriginal.addEventListener('click', () => speak(transcript.value, 'Original'));
    playAccent.addEventListener('click', () => speak(accentText.value, 'Accent'));

    // ✅ Accent Conversion
    clearBtn.addEventListener('click', () => {
      transcript.value = '';
      accentText.value = '';
      status.textContent = 'EmptyEntries cleared';
    });

    transcript.addEventListener('dblclick', () => {
      const text = transcript.value.trim();
      if (!text) return;
      // Simple word substitution
      const map = {
        'british-rp': { 'elevator': 'lift', 'apartment': 'flat', 'store': 'shop' },
        'australian': { 'hello': 'g’day' },
        'american-general': {}
      }[accentSelect.value];

      let result = text;
      Object.entries(map || {}).forEach(([from, to]) => {
        const re = new RegExp(`\\b${from}\\b`, 'gi');
        result = result.replace(re, to);
      });

      accentText.value = result;
      status.textContent = '🎯 Accent converted!';
    });

    log('💡 Click Step 1 to begin.');
  </script>
</body>
</html>
